# Déploiement sur Render via le Deploy Hook du service, puis vérification.
#
# Deux modes :
#  - ref       : Render construit l'image à partir du Dockerfile, au commit indiqué (celui validé par la CI) ;
#  - image-url : Render déploie une image déjà publiée (service de type « image »).
#
# Vérification (optionnelle, par ordre de préférence) :
#  - expected-version + URL du service : attend que <URL><version-path> renvoie la version ;
#  - secret RENDER_API_KEY : attend le statut `live` du déploiement via l'API Render.
# Puis smoke-command, si fournie (variable disponible : $SERVICE_URL).
#
# Dans le dépôt appelant (appeler avec `secrets: inherit`), environnement GitHub `render` :
#  - secret RENDER_DEPLOY_HOOK_URL : Render > service > Settings > Deploy Hook
#    (sans lui, le déploiement est ignoré avec un avertissement) ;
#  - variable RENDER_SERVICE_URL (optionnelle) : URL publique du service ;
#  - secret RENDER_API_KEY (optionnel).
name: Deploy Render

on:
  workflow_call:
    inputs:
      environment:
        description: "Environnement GitHub"
        type: string
        default: render
      ref:
        description: "Commit à déployer (mode build par Render)"
        type: string
        default: ""
      image-url:
        description: "Image à déployer (mode image), ex. ghcr.io/owner/app:1.2.3"
        type: string
        default: ""
      service-url:
        description: "URL publique du service (défaut : variable RENDER_SERVICE_URL)"
        type: string
        default: ""
      expected-version:
        description: "Version attendue sur version-path (vide = pas d'attente par version)"
        type: string
        default: ""
      version-path:
        type: string
        default: /version
      smoke-command:
        description: "Commande de vérification après déploiement (variable : $SERVICE_URL)"
        type: string
        default: ""
      wait-minutes:
        description: "Durée max d'attente du déploiement (le job est limité à 30 min)"
        type: number
        default: 15
    secrets:
      RENDER_DEPLOY_HOOK_URL:
        required: false
      RENDER_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.service-url != '' && inputs.service-url || vars.RENDER_SERVICE_URL }}
    concurrency:
      group: deploy-render-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_URL: ${{ inputs.service-url != '' && inputs.service-url || vars.RENDER_SERVICE_URL }}
      REF: ${{ inputs.ref }}
      IMAGE_URL: ${{ inputs.image-url }}
      VERSION: ${{ inputs.expected-version }}
      VERSION_PATH: ${{ inputs.version-path }}
      WAIT_MINUTES: ${{ inputs.wait-minutes }}
    steps:
      - name: Secret RENDER_DEPLOY_HOOK_URL absent
        if: env.HOOK == ''
        run: echo "::warning::Secret RENDER_DEPLOY_HOOK_URL non défini pour l'environnement ${{ inputs.environment }}, déploiement ignoré."

      - name: Vérifier la configuration
        if: env.HOOK != '' && env.SERVICE_URL != ''
        run: |
          if [[ ! "$SERVICE_URL" =~ ^https?://[^/]+ ]]; then
            echo "::error::L'URL du service doit commencer par https:// (valeur actuelle : '$SERVICE_URL')."
            exit 1
          fi

      - name: Déclencher le déploiement
        id: trigger
        if: env.HOOK != ''
        run: |
          url="$HOOK"
          add() { local sep='?'; [[ "$url" == *\?* ]] && sep='&'; url="${url}${sep}$1=$(jq -rn --arg v "$2" '$v|@uri')"; }
          [[ -n "$REF" ]] && add ref "$REF"
          [[ -n "$IMAGE_URL" ]] && add imgURL "$IMAGE_URL"
          curl -fsS -X POST --retry 3 -o response.json "$url"
          deploy_id=$(jq -r '.deploy.id // empty' response.json)
          echo "Déploiement Render lancé : ${deploy_id:-?} ${REF:+(commit $REF)}${IMAGE_URL:+(image $IMAGE_URL)}"
          echo "deploy-id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Attendre la nouvelle version
        if: env.HOOK != '' && env.SERVICE_URL != '' && env.VERSION != ''
        run: |
          deadline=$(( $(date +%s) + WAIT_MINUTES * 60 ))
          while (( $(date +%s) < deadline )); do
            current=$(curl -fsS --max-time 20 "${SERVICE_URL%/}${VERSION_PATH}" || true)
            if [[ "$current" == "$VERSION" ]]; then
              echo "Version $VERSION en ligne."
              exit 0
            fi
            echo "Version actuelle : ${current:-indisponible}, attendue : $VERSION"
            sleep 15
          done
          echo "::error::La version $VERSION n'est pas en ligne après $WAIT_MINUTES minutes."
          exit 1

      - name: Attendre le statut live (API Render)
        if: env.HOOK != '' && env.API_KEY != '' && steps.trigger.outputs.deploy-id != '' && (env.SERVICE_URL == '' || env.VERSION == '')
        env:
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy-id }}
        run: |
          service_id=$(grep -oE 'srv-[a-z0-9]+' <<<"$HOOK" | head -1)
          deadline=$(( $(date +%s) + WAIT_MINUTES * 60 ))
          while (( $(date +%s) < deadline )); do
            status=$(curl -fsS -H "Authorization: Bearer $API_KEY" \
              "https://api.render.com/v1/services/$service_id/deploys/$DEPLOY_ID" | jq -r '.status')
            echo "Statut : $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|pre_deploy_failed|deactivated)
                echo "::error::Déploiement Render en échec ($status)"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Délai dépassé en attendant le déploiement Render"; exit 1

      - name: Smoke test
        if: env.HOOK != '' && env.SERVICE_URL != '' && inputs.smoke-command != ''
        run: ${{ inputs.smoke-command }}

      - name: Résumé
        if: env.HOOK != ''
        run: |
          {
            echo "### Déployé sur Render"
            [[ -n "$REF" ]] && echo "Commit : \`$REF\`"
            [[ -n "$IMAGE_URL" ]] && echo "Image : \`$IMAGE_URL\`"
            [[ -n "$VERSION" ]] && echo "Version : $VERSION"
            [[ -n "$SERVICE_URL" ]] && echo "URL : $SERVICE_URL"
            true
          } >> "$GITHUB_STEP_SUMMARY"
