# Analyse CodeQL réutilisable. Ignorée sur les dépôts privés (GitHub Advanced Security requis).
name: CodeQL

on:
  workflow_call:
    inputs:
      languages:
        description: "Langages, séparés par des virgules (java-kotlin, javascript-typescript, python...)"
        type: string
        required: true
      build-mode:
        description: "none ou autobuild (manual : utiliser un workflow dédié)"
        type: string
        default: none
      queries:
        type: string
        default: security-and-quality
      timeout-minutes:
        type: number
        default: 20

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyse
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ inputs.languages }}
          build-mode: ${{ inputs.build-mode }}
          queries: ${{ inputs.queries }}

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
