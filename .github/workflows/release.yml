# Release automatisée avec release-please.
# À partir des commits au format Conventional Commits (feat:, fix:, feat!: ...),
# maintient une PR de release (CHANGELOG + bump de version). Une fois mergée,
# le tag et la GitHub Release sont créés : les outputs permettent alors de
# déclencher un build Docker ou un déploiement.
name: Release

on:
  workflow_call:
    inputs:
      release-type:
        description: "Type de projet release-please (node, python, simple, go, rust...)"
        type: string
        default: simple
      config-file:
        description: "Fichier de config release-please (mode manifest / monorepo)"
        type: string
        default: ""
      manifest-file:
        description: "Fichier manifest release-please (mode manifest / monorepo)"
        type: string
        default: ""
    secrets:
      token:
        description: "Token (PAT ou GitHub App) si les workflows doivent se déclencher sur la PR de release"
        required: false
    outputs:
      release-created:
        description: "true si une release vient d'être créée"
        value: ${{ jobs.release-please.outputs.release-created }}
      tag-name:
        description: "Tag de la release créée"
        value: ${{ jobs.release-please.outputs.tag-name }}
      version:
        description: "Version de la release créée"
        value: ${{ jobs.release-please.outputs.version }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.rp.outputs.release_created || 'false' }}
      tag-name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.token || secrets.GITHUB_TOKEN }}
          release-type: ${{ inputs.config-file == '' && inputs.release-type || '' }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
