# Construction d'une image Docker selon le principe « construire une fois, déployer partout » :
# l'image est construite une seule fois, testée (smoke test), scannée, puis conservée en
# artefact (tar) pour les jobs suivants (test Kubernetes, publication avec docker-publish.yml).
name: Docker Build

on:
  workflow_call:
    inputs:
      context:
        description: "Contexte de build Docker"
        type: string
        default: "."
      dockerfile:
        description: "Chemin du Dockerfile, relatif au contexte"
        type: string
        default: Dockerfile
      build-args:
        description: "Build args, un par ligne (KEY=VALUE)"
        type: string
        default: ""
      image-name:
        description: "Nom de l'image pour les labels OCI (défaut : ghcr.io/<owner>/<repo>)"
        type: string
        default: ""
      local-tag:
        description: "Tag local de l'image testée (réutilisé par k8s-test et docker-publish)"
        type: string
        default: app:ci
      smoke-checks:
        description: |
          Smoke test HTTP intégré (vide = aucun). Le conteneur est démarré, puis chaque ligne
          « <chemin> [corps attendu] » est vérifiée : réponse 2xx et, si fourni, corps identique.
          La première ligne sert aussi à attendre le démarrage. Ex. :
            /health
            /hello?name=CI Hello, CI!
        type: string
        default: ""
      smoke-port:
        description: "Port HTTP du conteneur"
        type: number
        default: 8080
      smoke-run-args:
        description: "Options de `docker run` pour le smoke test"
        type: string
        default: "--read-only --tmpfs /tmp"
      smoke-graceful-stop:
        description: "Exiger un arrêt propre sur SIGTERM (en moins de 10 s)"
        type: boolean
        default: true
      smoke-command:
        description: "Commande de smoke test personnalisée, en plus ou à la place (variable : $IMAGE)"
        type: string
        default: ""
      scanner:
        description: "Scanner de vulnérabilités : grype, trivy ou none"
        type: string
        default: grype
      scan-severity:
        description: "Sévérité minimale qui fait échouer le scan : low, medium, high, critical"
        type: string
        default: high
      artifact-name:
        description: "Nom de l'artefact contenant l'image"
        type: string
        default: image
      timeout-minutes:
        type: number
        default: 20
    outputs:
      local-tag:
        description: "Tag local de l'image"
        value: ${{ inputs.local-tag }}
      artifact-name:
        description: "Nom de l'artefact contenant l'image"
        value: ${{ inputs.artifact-name }}

permissions:
  contents: read

jobs:
  image:
    name: Build, smoke test et scan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      IMAGE: ${{ inputs.local-tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Métadonnées de l'image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image-name != '' && inputs.image-name || format('ghcr.io/{0}', github.repository) }}

      - name: Construire l'image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ inputs.local-tag }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Charger l'image
        run: docker load -i "$RUNNER_TEMP/image.tar"

      - name: Smoke test HTTP
        if: inputs.smoke-checks != ''
        env:
          CHECKS: ${{ inputs.smoke-checks }}
          PORT: ${{ inputs.smoke-port }}
          RUN_ARGS: ${{ inputs.smoke-run-args }}
          GRACEFUL: ${{ inputs.smoke-graceful-stop }}
        run: |
          # shellcheck disable=SC2086 # RUN_ARGS contient plusieurs options
          docker run -d -p "$PORT:$PORT" -e PORT="$PORT" $RUN_ARGS --name smoke "$IMAGE"
          trap 'docker logs smoke; docker rm -f smoke >/dev/null 2>&1 || true' EXIT
          base="http://localhost:$PORT"
          first=$(awk 'NF{print $1; exit}' <<<"$CHECKS")
          for _ in $(seq 1 60); do curl -fs -o /dev/null "$base$first" && break; sleep 1; done
          while read -r path expected; do
            [[ -z "$path" ]] && continue
            body=$(curl -fsS "$base$path")
            if [[ -n "$expected" && "$body" != "$expected" ]]; then
              echo "::error::$path a renvoyé « $body », attendu « $expected »"; exit 1
            fi
            echo "OK $path"
          done <<<"$CHECKS"
          docker stop --time 10 smoke >/dev/null
          code=$(docker inspect -f '{{.State.ExitCode}}' smoke)
          echo "Code de sortie après SIGTERM : $code"
          if [[ "$GRACEFUL" == true && "$code" == 137 ]]; then
            echo "::error::Le conteneur ne s'est pas arrêté dans les 10 s après SIGTERM (tué)."; exit 1
          fi

      - name: Smoke test personnalisé
        if: inputs.smoke-command != ''
        run: ${{ inputs.smoke-command }}

      - name: Scan de vulnérabilités (Grype)
        if: inputs.scanner == 'grype'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ inputs.local-tag }}
          fail-build: true
          severity-cutoff: ${{ inputs.scan-severity }}
          only-fixed: true
          output-format: table

      - name: Sévérités Trivy
        if: inputs.scanner == 'trivy'
        id: trivy
        env:
          MIN: ${{ inputs.scan-severity }}
        run: |
          all=(LOW MEDIUM HIGH CRITICAL); out=(); keep=false
          for s in "${all[@]}"; do [[ "$s" == "${MIN^^}" ]] && keep=true; $keep && out+=("$s"); done
          (IFS=,; echo "severity=${out[*]}" >> "$GITHUB_OUTPUT")

      - name: Scan de vulnérabilités (Trivy)
        if: inputs.scanner == 'trivy'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.local-tag }}
          ignore-unfixed: true
          severity: ${{ steps.trivy.outputs.severity }}
          exit-code: "1"

      - name: Conserver l'image pour les jobs suivants
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
