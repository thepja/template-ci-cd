# Analyses de sécurité réutilisables :
#  - détection de secrets commités (gitleaks)
#  - vulnérabilités des dépendances et mauvaises configurations (Trivy, mode filesystem)
#  - revue des nouvelles dépendances introduites par une PR (dependency-review)
name: Security

on:
  workflow_call:
    inputs:
      secrets-scan:
        description: "Activer gitleaks"
        type: boolean
        default: true
      fs-scan:
        description: "Activer Trivy sur le dépôt"
        type: boolean
        default: true
      fs-scan-fail-on:
        description: "Sévérités qui font échouer Trivy (vide = rapport seulement)"
        type: string
        default: "CRITICAL"
      dependency-review:
        description: "Activer dependency-review sur les pull requests"
        type: boolean
        default: true
    secrets:
      gitleaks-license:
        description: "Licence gitleaks (requise uniquement pour les dépôts d'organisation)"
        required: false

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (gitleaks)
    if: inputs.secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.gitleaks-license }}

  trivy:
    name: Dépendances & config (Trivy)
    if: inputs.fs-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          ignore-unfixed: true
          severity: ${{ inputs.fs-scan-fail-on != '' && inputs.fs-scan-fail-on || 'CRITICAL,HIGH' }}
          exit-code: ${{ inputs.fs-scan-fail-on != '' && '1' || '0' }}

  dependency-review:
    name: Revue des dépendances
    if: inputs.dependency-review && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
