# CI Node.js réutilisable (npm, pnpm ou yarn) : installation, lint, typecheck, tests, build.
# Chaque étape est optionnelle ; la matrice permet de tester plusieurs versions de Node.
name: Node CI

on:
  workflow_call:
    inputs:
      node-versions:
        description: 'Liste JSON des versions de Node, ex. ["22", "24"]'
        type: string
        default: '["24"]'
      package-manager:
        description: "npm, pnpm ou yarn"
        type: string
        default: npm
      working-directory:
        description: "Répertoire du projet (ex. frontend)"
        type: string
        default: "."
      install-command:
        description: "Commande d'installation (vide = commande par défaut du package manager, lockfile figé)"
        type: string
        default: ""
      lint-command:
        description: "Commande de lint (vide = ignorée)"
        type: string
        default: ""
      typecheck-command:
        description: "Commande de vérification de types (vide = ignorée)"
        type: string
        default: ""
      test-command:
        description: "Commande de tests (vide = ignorée)"
        type: string
        default: ""
      build-command:
        description: "Commande de build (vide = ignorée)"
        type: string
        default: ""
      upload-artifact:
        description: "Chemin du build à publier en artefact, relatif au working-directory (vide = aucun)"
        type: string
        default: ""
      artifact-name:
        type: string
        default: build
      timeout-minutes:
        type: number
        default: 10

permissions:
  contents: read

jobs:
  ci:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.node-versions) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Activer corepack (pnpm / yarn)
        if: inputs.package-manager != 'npm'
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || inputs.package-manager == 'yarn' && 'yarn.lock' || 'package-lock.json' }}

      - name: Installer les dépendances
        env:
          PM: ${{ inputs.package-manager }}
          INSTALL: ${{ inputs.install-command }}
        run: |
          if [[ -n "$INSTALL" ]]; then eval "$INSTALL"; exit; fi
          case "$PM" in
            npm)  npm ci --no-audit --no-fund ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --immutable ;;
            *)    echo "::error::package-manager inconnu : $PM"; exit 1 ;;
          esac

      - name: Lint
        if: inputs.lint-command != ''
        run: ${{ inputs.lint-command }}

      - name: Typecheck
        if: inputs.typecheck-command != ''
        run: ${{ inputs.typecheck-command }}

      - name: Tests
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}

      - name: Build
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}

      - name: Publier le build
        if: inputs.upload-artifact != '' && strategy.job-index == 0
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.upload-artifact }}
          retention-days: 7
