# Release automatisée avec release-please (alternative aux tags manuels).
# À partir des commits Conventional Commits (feat:, fix:, feat!: ...), maintient une PR de
# release (CHANGELOG + bump de version). Une fois mergée, le tag et la GitHub Release sont
# créés ; les outputs permettent alors d'enchaîner build et déploiement.
name: Release Please

on:
  workflow_call:
    inputs:
      release-type:
        description: "Type de projet (maven, node, python, simple...)"
        type: string
        default: simple
      config-file:
        description: "Fichier de config release-please (mode manifest / monorepo)"
        type: string
        default: ""
      manifest-file:
        description: "Fichier manifest release-please (mode manifest / monorepo)"
        type: string
        default: ""
    secrets:
      token:
        description: "PAT ou token de GitHub App, si les workflows doivent se déclencher sur la PR de release"
        required: false
    outputs:
      release-created:
        value: ${{ jobs.release-please.outputs.release-created }}
      tag-name:
        value: ${{ jobs.release-please.outputs.tag-name }}
      version:
        value: ${{ jobs.release-please.outputs.version }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release-created: ${{ steps.rp.outputs.release_created || 'false' }}
      tag-name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.token || secrets.GITHUB_TOKEN }}
          release-type: ${{ inputs.config-file == '' && inputs.release-type || '' }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
