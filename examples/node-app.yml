# Exemple : <projet>/.github/workflows/ci-cd.yml
# Application Node : CI, sécurité, release-please, puis image publiée et déployée sur Render
# (service Render de type « image ») à chaque release.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: thepja/template-ci-cd/.github/workflows/node-ci.yml@v1
    with:
      node-versions: '["22", "24"]'
      lint-command: npm run lint
      test-command: npm test
      build-command: npm run build

  security:
    uses: thepja/template-ci-cd/.github/workflows/security.yml@v1

  release:
    if: github.event_name == 'push'
    needs: [ci, security]
    permissions:
      contents: write
      pull-requests: write
    uses: thepja/template-ci-cd/.github/workflows/release-please.yml@v1
    with:
      release-type: node

  image:
    if: needs.release.outputs.release-created == 'true'
    needs: release
    uses: thepja/template-ci-cd/.github/workflows/docker-build.yml@v1
    with:
      local-tag: mon-app:ci

  publish:
    needs: image
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: thepja/template-ci-cd/.github/workflows/docker-publish.yml@v1
    with:
      local-tag: mon-app:ci

  deploy:
    needs: publish
    uses: thepja/template-ci-cd/.github/workflows/deploy-render.yml@v1
    with:
      image-url: ${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.tag }}
    secrets: inherit
