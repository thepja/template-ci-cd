# Exemple : <projet>/.github/workflows/ci.yml
# Projet Python (uv) : CI multi-versions, sécurité, image Docker testée puis publiée sur main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: thepja/template-ci-cd/.github/workflows/python-ci.yml@v1
    with:
      python-versions: '["3.12", "3.13"]'
      typecheck-command: uv run mypy .

  security:
    uses: thepja/template-ci-cd/.github/workflows/security.yml@v1

  image:
    needs: ci
    uses: thepja/template-ci-cd/.github/workflows/docker-build.yml@v1
    with:
      local-tag: mon-app:ci
      scanner: trivy

  publish:
    if: github.event_name == 'push'
    needs: image
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: thepja/template-ci-cd/.github/workflows/docker-publish.yml@v1
    with:
      local-tag: mon-app:ci
